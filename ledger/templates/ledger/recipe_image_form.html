{% extends "ledger/base.html" %}

{% block title %}Add Recipe Image{% endblock %}

{% block content %}
    <h2 class="page-heading">Add Image for {{ recipe.name }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit">Upload image</button>
    </form>

    <p style="margin-top: 16px;">
        <a href="{% url 'ledger:recipe_detail' recipe.pk %}">Back to recipe details</a>
    </p>
{% endblock %}
